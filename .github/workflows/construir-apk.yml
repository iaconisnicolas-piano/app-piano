name: Construir la app de Android

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar los archivos del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crear la clave de firma (solo la primera vez)
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -keystore keystore.jks -storepass teclas123 -keypass teclas123 -alias teclas -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Teclas y Manos"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore.jks
            git commit -m "Clave de firma de la app"
            git push
          fi

      - name: Armar el proyecto de Android
        run: |
          A=android/app/src/main
          mkdir -p $A/java/ar/teclasymanos $A/assets $A/res/drawable
          cp index.html $A/assets/index.html
          curl -fsSL -o $A/assets/osmd.js https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js
          curl -fsSL -o $A/assets/midi.js https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js
          curl -fsSL -o $A/assets/jszip.js https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js
          curl -fsSL -o $A/assets/noto-music.woff2 https://cdn.jsdelivr.net/npm/@fontsource/noto-music@5.3.0/files/noto-music-music-400-normal.woff2
          sed -i 's#https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js#osmd.js#; s#https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js#midi.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#jszip.js#' $A/assets/index.html
          sed -i '0,/<head>/s##<head><style>@font-face{font-family:"Noto Music";src:url(noto-music.woff2) format("woff2");}</style>#' $A/assets/index.html

          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TeclasYManos"
          include(":app")
          EOF

          cat > android/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false }
          EOF

          cat > android/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          val run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          android {
              namespace = "ar.teclasymanos"
              compileSdk = 34
              defaultConfig {
                  applicationId = "ar.teclasymanos"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = run
                  versionName = "1.$run"
              }
              signingConfigs {
                  create("fija") {
                      storeFile = file("../../keystore.jks")
                      storePassword = "teclas123"
                      keyAlias = "teclas"
                      keyPassword = "teclas123"
                  }
              }
              buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("fija") } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $A/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.usb.host" android:required="false" />
              <application
                  android:label="Teclas y Manos"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" android:resource="@xml/teclados_midi" />
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p $A/res/xml
          cat > $A/res/xml/teclados_midi.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="1" subclass="3" />
          </resources>
          EOF

          cat > $A/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#18202B" android:pathData="M10,2h28a8,8 0 0 1 8,8v28a8,8 0 0 1 -8,8h-28a8,8 0 0 1 -8,-8v-28a8,8 0 0 1 8,-8z"/>
              <path android:fillColor="#FBFCFD" android:pathData="M9,18h9v20h-9z M19.5,18h9v20h-9z M30,18h9v20h-9z"/>
              <path android:fillColor="#18202B" android:pathData="M15.5,18h5v12h-5z M26.5,18h5v12h-5z"/>
              <path android:fillColor="#D3741A" android:pathData="M17,10m-4,0a4,4 0 1 0 8,0a4,4 0 1 0 -8,0"/>
              <path android:fillColor="#53B3D8" android:pathData="M31,10m-4,0a4,4 0 1 0 8,0a4,4 0 1 0 -8,0"/>
          </vector>
          EOF

          cat > $A/java/ar/teclasymanos/MainActivity.java <<'EOF'
          package ar.teclasymanos;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.hardware.usb.UsbConstants;
          import android.hardware.usb.UsbDevice;
          import android.hardware.usb.UsbDeviceConnection;
          import android.hardware.usb.UsbEndpoint;
          import android.hardware.usb.UsbInterface;
          import android.hardware.usb.UsbManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          /* Lee el cable USB-MIDI directamente (como las apps de piano de la tienda),
             sin pasar por el servicio MIDI de Android. */
          public class MainActivity extends Activity {
              private static final String PERMISO = "ar.teclasymanos.PERMISO_USB";
              private static final int PEDIDO_ARCHIVO = 7;
              private WebView web;
              private UsbManager usb;
              private UsbDeviceConnection conexion;
              private UsbInterface interfaz;
              private Thread hilo;
              private volatile boolean leyendo = false;
              private boolean paginaLista = false;
              private final Handler main = new Handler(Looper.getMainLooper());
              private ValueCallback<Uri[]> elegirArchivo;

              private final BroadcastReceiver receptor = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context c, Intent i) {
                      String a = i.getAction();
                      UsbDevice d = i.getParcelableExtra(UsbManager.EXTRA_DEVICE);
                      if (PERMISO.equals(a)) {
                          if (d != null && i.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED, false)) abrir(d);
                          else avisar("Sin permiso para usar el cable. Tocá Buscar teclado y elegí Permitir", false);
                      } else if (UsbManager.ACTION_USB_DEVICE_ATTACHED.equals(a)) {
                          main.postDelayed(MainActivity.this::buscarTeclados, 500);
                      } else if (UsbManager.ACTION_USB_DEVICE_DETACHED.equals(a)) {
                          cerrar();
                          avisar("Se desconectó el teclado", false);
                      }
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  usb = (UsbManager) getSystemService(Context.USB_SERVICE);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new Puente(), "TeclasAndroid");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("http".equals(u.getScheme()) || "https".equals(u.getScheme())) {
                              try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                              return true;
                          }
                          return false;
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          paginaLista = true;
                          buscarTeclados();
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (elegirArchivo != null) elegirArchivo.onReceiveValue(null);
                          elegirArchivo = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try { startActivityForResult(Intent.createChooser(i, "Elegí una partitura"), PEDIDO_ARCHIVO); }
                          catch (Exception e) { elegirArchivo = null; return false; }
                          return true;
                      }
                  });
                  IntentFilter f = new IntentFilter(PERMISO);
                  f.addAction(UsbManager.ACTION_USB_DEVICE_ATTACHED);
                  f.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(receptor, f, Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(receptor, f);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  if (paginaLista) main.postDelayed(this::buscarTeclados, 500);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == PEDIDO_ARCHIVO && elegirArchivo != null) {
                      elegirArchivo.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      elegirArchivo = null;
                  } else super.onActivityResult(req, res, data);
              }

              /* Interfaz MIDI de un dispositivo USB: clase Audio (1), subclase MIDI Streaming (3) */
              private UsbInterface interfazMidi(UsbDevice d) {
                  for (int i = 0; i < d.getInterfaceCount(); i++) {
                      UsbInterface f = d.getInterface(i);
                      if (f.getInterfaceClass() == UsbConstants.USB_CLASS_AUDIO && f.getInterfaceSubclass() == 3 && entrada(f) != null) return f;
                  }
                  return null;
              }

              private UsbEndpoint entrada(UsbInterface f) {
                  for (int e = 0; e < f.getEndpointCount(); e++) {
                      UsbEndpoint ep = f.getEndpoint(e);
                      if (ep.getDirection() == UsbConstants.USB_DIR_IN &&
                          (ep.getType() == UsbConstants.USB_ENDPOINT_XFER_BULK || ep.getType() == UsbConstants.USB_ENDPOINT_XFER_INT)) return ep;
                  }
                  return null;
              }

              private void buscarTeclados() {
                  if (usb == null) { avisar("Esta tablet no permite conectar dispositivos USB", false); return; }
                  if (leyendo) return;
                  for (UsbDevice d : usb.getDeviceList().values()) {
                      if (interfazMidi(d) == null) continue;
                      if (usb.hasPermission(d)) abrir(d);
                      else {
                          Intent pi = new Intent(PERMISO).setPackage(getPackageName());
                          int flags = Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0;
                          usb.requestPermission(d, PendingIntent.getBroadcast(this, 0, pi, flags));
                          avisar("Tocá Permitir para usar el cable del teclado", false);
                      }
                      return;
                  }
                  avisar("No encuentro el teclado. Revisá el cable y tocá Buscar teclado", false);
              }

              private void abrir(UsbDevice d) {
                  cerrar();
                  UsbInterface f = interfazMidi(d);
                  if (f == null) return;
                  final UsbEndpoint ep = entrada(f);
                  UsbDeviceConnection c = usb.openDevice(d);
                  if (c == null) { avisar("No pude abrir el cable", false); return; }
                  if (!c.claimInterface(f, true)) { c.close(); avisar("Otra app está usando el cable. Cerrala y tocá Buscar teclado", false); return; }
                  conexion = c;
                  interfaz = f;
                  leyendo = true;
                  String n = d.getProductName();
                  avisar("Conectado: " + (n == null || n.trim().isEmpty() ? "cable MIDI" : n.trim()), true);
                  final UsbDeviceConnection con = c;
                  hilo = new Thread(() -> {
                      byte[] buf = new byte[Math.max(64, ep.getMaxPacketSize())];
                      while (leyendo) {
                          int k = con.bulkTransfer(ep, buf, buf.length, 250);
                          if (k <= 0) continue;
                          /* Cada evento USB-MIDI ocupa 4 bytes: encabezado + mensaje MIDI */
                          for (int i = 0; i + 3 < k; i += 4) {
                              int st = buf[i + 1] & 0xFF, nota = buf[i + 2] & 0x7F, vel = buf[i + 3] & 0x7F;
                              if ((st & 0xF0) == 0x90 && vel > 0) {
                                  final String js = "window.nativeMidi&&window.nativeMidi(" + nota + "," + vel + ")";
                                  main.post(() -> web.evaluateJavascript(js, null));
                              }
                          }
                      }
                  }, "lector-midi");
                  hilo.start();
              }

              private void cerrar() {
                  leyendo = false;
                  if (hilo != null) { try { hilo.join(400); } catch (InterruptedException e) { } hilo = null; }
                  if (conexion != null) {
                      try { if (interfaz != null) conexion.releaseInterface(interfaz); } catch (Exception e) { }
                      try { conexion.close(); } catch (Exception e) { }
                  }
                  conexion = null;
                  interfaz = null;
              }

              private void avisar(String texto, boolean ok) {
                  final String js = "window.nativeMidiStatus&&window.nativeMidiStatus('" + texto.replace("\\", "\\\\").replace("'", "\\'") + "'," + ok + ")";
                  main.post(() -> web.evaluateJavascript(js, null));
              }

              private class Puente {
                  @JavascriptInterface
                  public void rescan() { main.post(() -> { cerrar(); buscarTeclados(); }); }
              }

              @Override
              protected void onDestroy() {
                  cerrar();
                  try { unregisterReceiver(receptor); } catch (Exception e) { }
                  super.onDestroy();
              }
          }
          EOF

      - name: Compilar
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TeclasYManos.apk
          gh release create "v${{ github.run_number }}" TeclasYManos.apk --title "Teclas y Manos (versión ${{ github.run_number }})" --notes "Tocá TeclasYManos.apk para descargarla e instalarla en la tablet." --latest

      - name: Guardar copia del APK
        uses: actions/upload-artifact@v4
        with:
          name: TeclasYManos-APK
          path: TeclasYManos.apk
